<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nghị luận Vỡ Lòng · Khoá 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../assets/ms.css">
<style>
  /* Khoá 2 (dựng theo khuôn Khoá 1) — sân khấu một cột: Cá Heo + bong bóng thoại ở trên, hoạt động ở dưới.
     Màu riêng của chuỗi Nghị luận: xanh biển tươi + cam Mở Sách; 5 lớp bánh hamburger. */
  :root {
    --sea: #e6f6f6;
    --l1: #f0a640;  /* nắp bánh  — câu chủ đề */
    --l2: #5fb760;  /* xà lách   — lý lẽ */
    --l3: #93553a;  /* thịt      — bằng chứng */
    --l4: #ffc93c;  /* phô mai   — phân tích */
    --l5: #d98a32;  /* đế bánh   — kết đoạn */
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sea: #122a2b; } }
  :root[data-theme="dark"] { --sea: #122a2b; }

  body { background: var(--paper); }
  .topbar .wrap { flex-wrap: wrap; row-gap: 6px; }
  .back { font-weight: 600; text-decoration: none; color: var(--teal-ink); white-space: nowrap; }
  .starbar { display: flex; align-items: center; gap: 8px; }
  .starbar .stars svg { width: 26px; height: 26px; transition: transform .3s ease; }
  .starbar .stars svg.pop { animation: pop .7s ease; }
  @keyframes pop { 0% { transform: scale(.4) rotate(-40deg); } 60% { transform: scale(1.5) rotate(15deg); } 100% { transform: scale(1) rotate(0); } }
  .steps { display: flex; gap: 6px; align-items: center; }
  .steps i { width: 10px; height: 10px; border-radius: 50%; background: var(--star-off); }
  .steps i.done { background: var(--teal); }
  .steps i.now { background: var(--orange); width: 26px; border-radius: 6px; }
  .steps-wrap { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .stage { padding-block: 22px 60px; display: grid; gap: 20px; max-width: 820px; min-width: 0; width: 100%; }
  .eyebrow { font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--orange-ink); }
  .stage h1 { font-size: clamp(1.7rem, 4.4vw, 2.4rem); color: var(--teal-ink); margin-top: 2px; }

  /* Cá Heo + bong bóng */
  .talk { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 14px; align-items: end; }
  .nem { width: 112px; height: auto; overflow: visible; }
  .nem .body { fill: var(--teal); } .nem .belly { fill: var(--paper); } .nem .dark { fill: var(--teal-ink); }
  .nem .eye { fill: #18282a; } .nem .cap { fill: var(--orange); } .nem .smile { stroke: #18282a; }
  .nem.happy { animation: jump .8s ease; }
  .nem.think { animation: tilt 1s ease; }
  @keyframes jump { 0%,100% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-22px) rotate(-8deg); } 60% { transform: translateY(0) rotate(4deg); } }
  @keyframes tilt { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 60% { transform: rotate(5deg); } }
  .bubble { position: relative; background: var(--sea); border-radius: 20px 20px 20px 6px; padding: 14px 18px; font-size: 1.05rem; line-height: 1.55; min-width: 0; }
  .bubble b.who { display: block; font: 700 .8rem var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--teal-ink); margin-bottom: 2px; }

  .panel { display: grid; gap: 14px; }
  .q { font-weight: 600; font-size: 1.08rem; }

  /* lựa chọn trắc nghiệm */
  .opts { display: grid; gap: 10px; }
  .opt { display: grid; grid-template-columns: 38px minmax(0, 1fr) 28px; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 14px 16px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: 500 1rem/1.5 var(--font-body); cursor: pointer; }
  .opt:hover:not([disabled]) { border-color: var(--teal); }
  .opt .k { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-3); font-weight: 700; }
  .opt .mk { font-weight: 800; font-size: 1.2rem; text-align: center; }
  .opt[disabled] { cursor: default; }
  .opt.right { border-color: var(--ok); background: var(--ok-soft); }
  .opt.right .k { background: var(--ok); color: var(--paper); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .opt.wrong .k { background: var(--bad); color: var(--paper); }
  .opt.right .mk { color: var(--ok); } .opt.wrong .mk { color: var(--bad); }

  /* lớp bánh */
  .layer { display: inline-block; width: 46px; height: 14px; border-radius: 8px; flex: none; }
  .layer.l1 { background: var(--l1); border-radius: 23px 23px 6px 6px; height: 18px; }
  .layer.l2 { background: var(--l2); height: 10px; border-radius: 10px 2px 10px 2px; }
  .layer.l3 { background: var(--l3); }
  .layer.l4 { background: var(--l4); height: 9px; border-radius: 2px; }
  .layer.l5 { background: var(--l5); border-radius: 6px 6px 16px 16px; height: 14px; }

  /* Màn 2: các phần bánh */
  .parts { display: grid; gap: 10px; }
  .part { border: 2px solid var(--line); border-radius: var(--r-md); background: var(--paper); overflow: hidden; }
  .part > button { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 14px 16px; }
  .part > button:focus-visible { outline: 3px solid var(--orange); outline-offset: -3px; }
  .part .nm { font-weight: 700; }
  .part .nm small { display: block; font-weight: 500; color: var(--ink-2); font-size: .85rem; }
  .part .tog { font-weight: 700; color: var(--teal-ink); font-size: .9rem; }
  .part .more { padding: 0 16px 16px 78px; display: grid; gap: 10px; }
  .part .sent { font-size: 1.02rem; padding: 10px 14px; border-left: 4px solid var(--teal); background: var(--paper-2); border-radius: 0 10px 10px 0; }
  .part .say { color: var(--teal-ink); font-weight: 500; }
  .part.seen { border-color: var(--teal); }
  .note { font-size: .82rem; color: var(--ink-2); font-style: italic; }

  /* Màn 3: khay nhãn + câu */
  .tray { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; background: var(--paper-2); border-radius: var(--r-md); border: 1px dashed var(--line); min-height: 64px; align-items: center; }
  .tray .empty { color: var(--ink-2); font-size: .9rem; }
  .tag { display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 14px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: 600 .95rem var(--font-body); cursor: pointer; }
  .tag[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 30%, transparent); }
  .tag .layer { width: 28px; }
  .slots { display: grid; gap: 10px; }
  .slot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 14px; border: 2px solid var(--line); border-radius: var(--r-md); background: var(--paper); }
  .slot p { font-size: 1rem; }
  .slot .drop { justify-self: start; min-height: 40px; padding: 6px 14px; border-radius: 999px; border: 2px dashed var(--teal); background: transparent; color: var(--teal-ink); font: 600 .9rem var(--font-body); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .slot .drop.filled { border-style: solid; background: var(--teal-soft); }
  .slot.right { border-color: var(--ok); background: var(--ok-soft); }
  .slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .slot .why { font-size: .9rem; color: var(--bad); font-weight: 500; }

  /* Màn 4: xếp bánh */
  .burger { display: grid; gap: 8px; }
  .bslot { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 58px; padding: 8px 12px; border-radius: var(--r-md); border: 2px dashed var(--line); background: var(--paper-2); }
  .bslot .nm { font-size: .8rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
  .bslot button { all: unset; box-sizing: border-box; cursor: pointer; font-size: .98rem; display: block; width: 100%; }
  .bslot button:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; border-radius: 6px; }
  .bslot.filled { border-style: solid; background: var(--paper); }
  .bslot.right { border-color: var(--ok); background: var(--ok-soft); }
  .bslot.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .pool { display: grid; gap: 8px; }
  .card { text-align: left; width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: 500 .98rem/1.5 var(--font-body); cursor: pointer; }
  .card:hover { border-color: var(--teal); }
  .sub { font: 700 .82rem var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }

  /* Màn 5 */
  .round { display: grid; gap: 12px; padding: 18px; border: 2px solid var(--line); border-radius: var(--r-lg); background: var(--paper); }
  .round .num { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .para { padding: 12px 16px; background: var(--paper-2); border-radius: 12px; font-size: 1rem; }
  .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .clock { display: inline-flex; gap: 6px; align-items: center; font-size: .85rem; font-weight: 600; color: var(--orange-ink); }
  .clock svg { width: 18px; height: 18px; animation: spin 4s linear infinite; }
  .clock circle, .clock path { stroke: currentColor; fill: none; stroke-width: 2.2; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Màn 6 */
  .award { display: grid; gap: 14px; justify-items: center; text-align: center; padding: 26px 18px; border-radius: var(--r-lg); background: var(--sea); }
  .award .stars svg { width: 44px; height: 44px; }
  .award .big { font: 800 clamp(2.4rem, 8vw, 3.4rem)/1 var(--font-display); color: var(--teal-ink); font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--orange); color: var(--cta-fg); font-weight: 700; }
  .next { display: grid; gap: 6px; padding: 16px 18px; border: 2px dashed var(--line); border-radius: var(--r-md); }
  .recap { display: grid; gap: 8px; }
  .recap li { display: flex; gap: 10px; align-items: center; }
  .recap ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .actions .grow { flex: 1; }
  .namefield { display: flex; gap: 10px; flex-wrap: wrap; }
  .namefield input { flex: 1 1 200px; min-width: 0; min-height: 48px; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper-2); color: var(--ink); font: 500 1rem var(--font-body); }
  .rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .rules div { padding: 12px 14px; background: var(--paper-2); border-radius: 12px; font-size: .92rem; }
  .rules b { display: block; font-family: var(--font-display); font-size: 1.15rem; color: var(--teal-ink); }



  /* Mục lục bên trái (đóng/mở được) */
  .navbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: 600 .9rem var(--font-body); cursor: pointer; }
  .navbtn svg { width: 18px; height: 18px; } .navbtn path { stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; fill: none; }
  .navbtn[aria-expanded="true"] { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-ink); }
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; max-width: 1180px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .layout.closed { grid-template-columns: minmax(0, 1fr); max-width: 868px; }
  .layout.closed .side { display: none; }
  .side { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 86px); overflow: auto;
    padding-block: 22px; display: grid; gap: 14px; align-content: start; }
  .side-head { display: flex; justify-content: space-between; align-items: center; }
  .side-x { display: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--paper-3); color: var(--ink); font-size: 1.4rem; cursor: pointer; }
  .side-course { font-size: .85rem; color: var(--ink-2); }
  .side-course b { display: block; font: 700 1.15rem/1.25 var(--font-display); color: var(--teal-ink); margin-top: 2px; }
  .side-prog { display: grid; gap: 6px; font-size: .82rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .side-prog .bar { height: 8px; border-radius: 999px; background: var(--paper-3); overflow: hidden; }
  .side-prog .bar i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: width .4s ease; }
  .side-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .side-list button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; }
  .side-list button:hover:not([aria-disabled="true"]) { background: var(--paper-2); }
  .side-list button:focus-visible { outline: 3px solid var(--orange); outline-offset: 1px; }
  .side-list .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: .85rem; background: var(--paper-3); color: var(--ink-2); }
  .side-list .tt { font-size: .93rem; line-height: 1.3; }
  .side-list .tt small { display: block; font-size: .75rem; color: var(--ink-2); letter-spacing: .04em; }
  .side-list .done .no { background: var(--teal); color: var(--btn-fg); }
  .side-list [aria-current="step"] { background: var(--orange-soft); }
  .side-list [aria-current="step"] .no { background: var(--orange); color: var(--cta-fg); }
  .side-list [aria-current="step"] .tt { font-weight: 700; }
  .side-list [aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
  .side-list .stars svg { width: 14px; height: 14px; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 25, 26, .45); z-index: 39; }
  @media (max-width: 900px) {
    .layout, .layout.closed { grid-template-columns: minmax(0, 1fr); max-width: 868px; }
    .layout .side, .layout.closed .side { display: grid; position: fixed; top: 0; bottom: 0; left: 0; z-index: 40; width: min(320px, 86vw); max-height: none; height: 100vh; height: 100dvh; align-self: stretch; overflow-y: auto;
      background: var(--paper); box-shadow: var(--shadow); padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
      transform: translateX(-105%); transition: transform .25s ease; }
    .layout.open-m .side { transform: none; }
    .side-x { display: grid; place-items: center; }
    .navbtn span { display: none; }
  }

  /* Bìa khoá (Giới thiệu) */
  .cover { position: relative; overflow: hidden; border-radius: var(--r-lg); color: #ffffff;
    background: radial-gradient(120% 90% at 85% 10%, #3fa5a7 0%, #1d6b6d 55%, #134d4f 100%);
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 12px; align-items: center;
    padding: 28px 28px 54px; min-height: 280px; }
  .cover .txt { display: grid; gap: 10px; position: relative; z-index: 1; min-width: 0; }
  .cover .kicker { font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #ffd9b0; }
  .cover h1 { color: #ffffff; font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.02; }
  .cover h1 span { display: block; color: #ffb366; }
  .cover .sub2 { font-size: 1.05rem; color: #dff3f3; max-width: 34ch; }
  .cover .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .cover .pills span { font-size: .82rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); color: #ffffff; font-variant-numeric: tabular-nums; }
  .cover .art { position: relative; z-index: 1; justify-self: center; width: 100%; max-width: 280px; }
  .cover .art svg { width: 100%; height: auto; display: block; overflow: visible; }
  .cover .waves { position: absolute; left: 0; right: 0; bottom: -1px; width: 100%; height: 46px; z-index: 0; }
  .cover .waves path { fill: var(--paper); }
  .cover .waves path.back { fill: var(--paper); opacity: .35; }
  #stage:focus { outline: none; }
  .cover .nem { width: 120px; height: 100px; }
  .cover .nem .body { fill: #9ee0e1; } .cover .nem .dark { fill: #50b1b3; } .cover .nem .belly { fill: #ffffff; }
  .cover .bub { fill: rgba(255,255,255,.18); }
  .cover .art .burger-l { animation: stack .7s cubic-bezier(.3,1.4,.6,1) both; }
  .cover .art .burger-l:nth-child(2) { animation-delay: .08s; } .cover .art .burger-l:nth-child(3) { animation-delay: .16s; }
  .cover .art .burger-l:nth-child(4) { animation-delay: .24s; } .cover .art .burger-l:nth-child(5) { animation-delay: .32s; }
  @keyframes stack { from { transform: translateY(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
  .cover .dolph { animation: swim 3.2s ease-in-out infinite; transform-origin: center; }
  @keyframes swim { 50% { transform: translateY(-6px) rotate(-3deg); } }

  @media (max-width: 600px) {
    .cover { grid-template-columns: minmax(0, 1fr); padding: 22px 18px 50px; }
    .cover .art { max-width: 210px; order: -1; }
    .talk { grid-template-columns: 72px minmax(0, 1fr); }
    .nem { width: 72px; }
    .part .more { padding-left: 16px; }
    .pair, .rules { grid-template-columns: minmax(0, 1fr); }
    .steps-wrap .lbl { display: none; }
  }

  /* ---------- riêng Khoá 2 ---------- */
  .part .ico { font-size: 1.6rem; width: 50px; text-align: center; }
  .crit { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .crit div { padding: 12px 14px; border-radius: 12px; background: var(--orange-soft); font-size: .92rem; }
  .crit b { display: block; font: 800 1.2rem var(--font-display); color: var(--orange-ink); }
  .ctx { display: grid; gap: 6px; padding: 12px 16px; border-radius: 12px; background: var(--paper-2); border-left: 4px solid var(--l1); }
  .ctx p { font-size: 1rem; } .ctx b { color: var(--teal-ink); }
  .ctx .ev { border-left-color: var(--l3); }
  .traps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .traps div { padding: 12px 14px; border-radius: 12px; background: var(--bad-soft); font-size: .92rem; }
  .traps b { display: block; color: var(--bad); font-weight: 700; }
  .formula { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; }
  .formula span { padding: 6px 12px; border-radius: 999px; background: var(--paper-3); }
  .formula span.k { background: var(--l4); color: #1f1406; }
  .topics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .topic { text-align: left; padding: 14px 16px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: 500 .98rem/1.5 var(--font-body); cursor: pointer; display: grid; gap: 4px; }
  .topic b { font-family: var(--font-display); font-size: 1.05rem; color: var(--teal-ink); }
  .topic[aria-pressed="true"] { border-color: var(--orange); background: var(--orange-soft); }
  .wbox { display: grid; gap: 8px; }
  .wbox label { font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .wbox textarea { width: 100%; min-height: 110px; padding: 12px 14px; border-radius: var(--r-md); border: 2px solid var(--line); background: var(--paper-2); color: var(--ink); font: 500 1rem/1.6 var(--font-body); resize: vertical; }
  .wbox textarea:focus { border-color: var(--teal); outline: none; }
  .starters { display: flex; flex-wrap: wrap; gap: 6px; }
  .starters button { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 2px dashed var(--teal); background: transparent; color: var(--teal-ink); font: 600 .88rem var(--font-body); cursor: pointer; }
  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .checks label { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--paper-2); cursor: pointer; }
  .checks input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--teal); }

<script src="../assets/ms.js"></script>
<script>
(function () {
  var COURSE_ID = "nghi-luan-2", MAX = 5;
  var LABELS = [

    { id: 2, name: "Lý lẽ", food: "Xà lách", cls: "l2" },

    { id: 5, name: "Kết đoạn", food: "Đế bánh", cls: "l5" }
  ];
  var NEM_SVG = '<svg class="nem" id="nem" viewBox="0 0 120 100" role="img" aria-label="Cá Heo, bạn học đồng hành">' +
    '<path class="body" d="M18 62C20 36 50 20 80 23c16 2 28 11 33 21-8 0-14 2-18 6-4 14-20 26-42 28-12 1-22-2-28-6-6 6-14 10-22 10 4-6 9-12 15-20z"/>' +
    '<path class="dark" d="M54 25c2-12 9-19 18-22-3 8-3 15-1 22z"/>' +

    '<path class="belly" d="M30 67c16 6 42 4 62-16-6 15-22 24-41 25-9 0-16-3-21-9z" opacity=".9"/>' +

    '<path class="cap" d="M74 21l15-7 15 7-15 7z"/><path class="cap" d="M80 24v6c6 3 12 3 18 0v-6l-9 4z"/>' +
    '<path d="M104 21v9" stroke="#ff8300" stroke-width="2" stroke-linecap="round"/><circle class="cap" cx="104" cy="31" r="2.2"/>' +
    "</svg>";

  var state = { screen: 0, stars: [false, false, false, false, false], name: MS.getName() };
  var stage = document.getElementById("stage");

  /* ---------- tiện ích ---------- */
  function who() { return state.name || "bạn"; }
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shuffleNotSame(a) { var s; do { s = shuffle(a); } while (s.every(function (x, i) { return x === a[i]; })); return s; }
  function layer(cls) { return '<span class="layer ' + cls + '" aria-hidden="true"></span>'; }
  /* Gọi HS bằng tên: thay đại từ "bạn" bằng tên đã lưu (trừ "bạn bè", "bạn học", "bạn Minh"…) */
  function named(text) {
    if (!state.name) return text;
    var nm = MS.esc(state.name);

  }

  function head(eyebrow, title) { return '<div><div class="eyebrow">' + eyebrow + "</div><h1>" + title + "</h1></div>"; }

  function starCount() { return state.stars.filter(Boolean).length; }
  function renderStars(popIndex) {

  }
  function renderSteps() {
    var s = ""; for (var i = 0; i <= 6; i++) s += '<i class="' + (i < state.screen ? "done" : i === state.screen ? "now" : "") + '"></i>';

  var LESSONS = [

    { t: "Chọn bằng chứng mạnh", k: "Bài 3", st: [2] }, { t: "Phân tích bằng chứng", k: "Bài 4", st: [3] }, { t: "Tự viết", k: "Bài 5", st: [4] },
    { t: "Tổng kết", k: "Bài 6" }
  ];
  var mq = window.matchMedia("(max-width: 900px)");
  var layout = document.getElementById("layout"), navBtn = document.getElementById("nav-toggle"), scrim = document.getElementById("scrim");
  function navOpen() { return mq.matches ? layout.classList.contains("open-m") : !layout.classList.contains("closed"); }
  function setNav(open) {
    if (mq.matches) { layout.classList.toggle("open-m", open); scrim.hidden = !open; }

  }
  navBtn.onclick = function () { setNav(!navOpen()); };
  document.getElementById("side-close").onclick = function () { setNav(false); navBtn.focus(); };
  scrim.onclick = function () { setNav(false); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && mq.matches && navOpen()) setNav(false); });
  if (mq.addEventListener) mq.addEventListener("change", function () { layout.classList.remove("open-m"); scrim.hidden = true; navBtn.setAttribute("aria-expanded", String(navOpen())); });
  navBtn.setAttribute("aria-expanded", String(navOpen()));
  function renderNav() {
    state.reached = Math.max(state.reached || 0, state.screen);
    var done = 0;
    document.getElementById("side-list").innerHTML = LESSONS.map(function (L, i) {
      var isDone = i < state.reached || (i === 6 && state.screen === 6), cur = i === state.screen, open = i <= state.reached;
      if (i > 0 && isDone) done++;
      var st = L.st ? MS.starsHTML(L.st.filter(function (k) { return state.stars[k]; }).length, L.st.length) : "";
      return '<li><button type="button" data-l="' + i + '" class="' + (isDone ? "done" : "") + '"' + (cur ? ' aria-current="step"' : "") + (open ? "" : ' aria-disabled="true"') + ">" +
        '<span class="no">' + (isDone && !cur ? "✓" : i === 0 ? "★" : i) + '</span><span class="tt"><small>' + L.k + "</small>" + L.t + "</span>" + (open ? st : '<span class="sr-only">Chưa mở</span>') + "</button></li>";
    }).join("");
    document.getElementById("prog-fill").style.width = Math.round(done / 6 * 100) + "%";
    document.getElementById("prog-txt").textContent = "Đã học " + done + "/6 bài";
  }
  document.getElementById("side-list").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-l]"); if (!b) return;

    if (mq.matches) setNav(false);
    go(+b.getAttribute("data-l"));
  });

  function go(n) {
    state.screen = n; renderSteps(); renderNav();
    var fresh = stage.cloneNode(false); stage.parentNode.replaceChild(fresh, stage); stage = fresh;
    SCREENS[n]();
    window.scrollTo({ top: 0, behavior: "smooth" });
    stage.focus({ preventScroll: true });
  }
  function nextBtn(label, enabled) {
    return '<div class="actions"><span class="grow"></span><button class="btn cta" id="next" type="button"' + (enabled ? "" : " disabled") + ">" + label + "</button></div>";
  }
  function bindNext(n) { var b = document.getElementById("next"); if (b) b.onclick = function () { go(n); }; }
  function enableNext() { var b = document.getElementById("next"); if (b) { b.disabled = false; } }

  /* MCQ dùng chung: 1 lần chọn, sai thì hiện đáp án đúng */
  function mcq(container, options, correct, onDone) {
    var keys = "ABCD";
    container.innerHTML = options.map(function (o, i) {
      return '<button class="opt" type="button" data-i="' + i + '"><span class="k">' + keys[i] + '</span><span>' + o + '</span><span class="mk" aria-hidden="true"></span></button>';
    }).join("");
    container.addEventListener("click", function h(e) {
      var b = e.target.closest(".opt"); if (!b) return;
      var i = +b.getAttribute("data-i"), ok = i === correct;
      container.removeEventListener("click", h);
      container.querySelectorAll(".opt").forEach(function (x, j) {
        x.disabled = true;

        else if (j === i) { x.classList.add("wrong"); x.querySelector(".mk").textContent = "✗"; }
      });
      onDone(ok);
    });
  }


  /* ---------- NỘI DUNG KHOÁ 2 ----------
     Mọi bằng chứng mẫu đều có thật và có nguồn (ghi ngay dưới), không dùng nhân vật bịa như "bạn Lan lớp 7A":
     bằng chứng phải kiểm chứng được (SGK Ngữ văn 7: "xác thực, tiêu biểu"; Common Core W.7.1: "accurate, credible sources").
     Chuyện của bản thân khó kiểm chứng nên chỉ để minh hoạ thêm, không làm bằng chứng chính. */
  var TYPES = [
    { ico: "📊", n: "Số liệu từ nghiên cứu", d: "Con số do một nghiên cứu, cuộc khảo sát có tên tuổi đưa ra.",
      ex: "Đề “Học sinh nên chơi thể thao”: Một nghiên cứu theo dõi 1.002 người lớn ở Mỹ trong 12 tuần mùa thu – đông (Nieman và cộng sự, 2010) cho thấy người tập thể dục từ 5 ngày mỗi tuần trở lên có số ngày bị cảm, viêm họng ít hơn 43% so với người hầu như không tập.", src: "Nguồn: British Journal of Sports Medicine, 2010." },
    { ico: "🏛️", n: "Khuyến nghị của tổ chức uy tín", d: "Lời khuyên chính thức của một tổ chức chuyên môn (y tế, giáo dục…).",
      ex: "Đề “Học sinh không nên thức khuya”: Viện Hàn lâm Y học Giấc ngủ Hoa Kỳ (AASM, 2016) khuyến nghị trẻ 6–12 tuổi cần ngủ 9–12 tiếng mỗi ngày, tuổi 13–18 cần 8–10 tiếng, nhiều hơn người lớn.", src: "Nguồn: Journal of Clinical Sleep Medicine, 2016." },
    { ico: "💬", n: "Lời của người có uy tín", d: "Câu nói của nhà khoa học, nhà văn, lãnh tụ… ghi rõ ai nói, nói ở đâu.",
      ex: "Đề “Học sinh nên chơi thể thao”: Trong bài “Sức khoẻ và thể dục” (1946), Chủ tịch Hồ Chí Minh viết: “Mỗi một người dân yếu ớt tức là làm cho cả nước yếu ớt một phần; mỗi một người dân mạnh khoẻ là góp phần cho cả nước mạnh khoẻ.”", src: "Nguồn: Hồ Chí Minh toàn tập, tập 4." },

      ex: "Đề “Học sinh nên đọc sách mỗi ngày”: Tỉ phú Bill Gates viết trên blog Gates Notes (2016) rằng từ nhỏ ông đã đọc trung bình khoảng một cuốn sách mỗi tuần; trên blog này, ông thường viết lại những điều mình học được từ các cuốn sách đã đọc.", src: "Nguồn: gatesnotes.com, bài “My favorite books of 2016”." }
  ];
  var TOPICS = [
    { id: "van-dong", topic: "Học sinh nên vận động ít nhất một tiếng mỗi ngày.", reason: "Vận động đều đặn giúp cơ thể khoẻ mạnh.",

    { id: "ngu-som", topic: "Học sinh không nên thức khuya.", reason: "Học sinh cần ngủ nhiều hơn người lớn.",
      ev: "Viện Hàn lâm Y học Giấc ngủ Hoa Kỳ (AASM, 2016) khuyến nghị trẻ 6–12 tuổi cần ngủ 9–12 tiếng mỗi ngày, tuổi 13–18 cần 8–10 tiếng, nhiều hơn người lớn.",

  var CHECKS = [

  var SAVE_KEY = "mosach.nl2.bai.v1";
  function loadBai() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null") || {}; } catch (e) { return {}; } }
  function saveBai(o) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) {} }
  function ctx(topic, reason) { return '<div class="ctx"><p><b>Câu chủ đề:</b> ' + topic + "</p><p><b>Lý lẽ:</b> " + reason + "</p></div>"; }
  /* hai câu trắc nghiệm liền nhau: đúng ngay cả hai thì được sao */
  function twoQs(qs, starIdx, praise, after) {
    var ok = 0, done = 0;
    qs.forEach(function (q, i) {
      mcq(document.getElementById("q" + i), q.o, q.r, function (good) {
        if (good) ok++; done++;

          if (ok === qs.length) { award(starIdx); say(praise, "happy"); }

          if (after) after(); enableNext();
        }
      });

  }
  function rounds(qs) {

    }).join("");
  }

  function cover() {
    var dol = NEM_SVG.replace(' id="nem"', '').replace('class="nem"', 'class="nem dolph"').replace('role="img" aria-label="Cá Heo, bạn học đồng hành"', 'aria-hidden="true"');

    var L = [["var(--l1)", "M30 70c0-26 30-40 70-40s70 14 70 40z", .35], ["var(--l2)", "M24 74h152c4 0 4 10-2 10-10 0-14 6-24 6s-14-6-26-6-14 6-26 6-14-6-26-6-14 6-26 6-14-6-24-6c-6 0-6-10 2-10z", .35],
             ["var(--l3)", "M30 92h140a8 8 0 0 1 0 22H30a8 8 0 0 1 0-22z", 1], ["var(--l4)", "M26 118h148l-8 10-12-6-14 8-14-8-16 8-14-8-16 8-14-8-14 8-12-6-10 4z", 1],

    return '<section class="cover" aria-labelledby="cv-t">' +
      '<div class="txt"><span class="kicker">Mở Sách · Nghị luận Vỡ Lòng · Khoá 2</span>' +
      '<h1 id="cv-t">Tự tay làm <span>lớp thịt và lớp phô mai</span></h1>' +
      '<p class="sub2">Học cách chọn bằng chứng có thật, kiểm chứng được và viết câu phân tích, hai phần làm nên “sức nặng” của đoạn nghị luận.</p>' +

    ev.addEventListener("input", refresh); an.addEventListener("input", refresh);
    document.getElementById("wcheck").onclick = function () {
      // gợi ý nhẹ, không chấm điểm
      var hint = [];
      if (/(^|[^\p{L}])(em|mình|tôi|tớ)(?![\p{L}])/iu.test(ev.value)) hint.push("Bằng chứng đang kể chuyện của chính bạn. Chuyện riêng người khác khó kiểm tra, thử thay bằng số liệu, khuyến nghị hay tấm gương người thật nha!");
      else if (!/(theo|nghiên cứu|khảo sát|tổ chức|viện|báo|sách|năm \d{4}|\(\d{4}\))/i.test(ev.value)) hint.push("Bằng chứng chưa nói rõ nguồn. Thêm “Theo…”, tên tổ chức, nghiên cứu hoặc năm để người đọc tra lại được nha!");
      if (!/\d/.test(ev.value) && !/(^|\s)[A-ZĐÂĂÊÔƠƯÁÀẢÃẠ][a-zđâăêôơưáàảãạéèẻẽẹíìỉĩịóòỏõọúùủũụýỳỷỹỵấầẩẫậắằẳẵặếềểễệốồổỗộớờởỡợứừửữự]+/.test(ev.value.replace(/^\s*\S+/, ""))) hint.push("Bằng chứng chưa thấy con số hay tên riêng nào. Thêm vào cho cụ thể hơn nha!");
      if (!/(cho thấy|chứng tỏ|chứng minh|nghĩa là|từ đó|vì vậy mà|nhờ đó)/i.test(an.value)) hint.push("Phân tích nên có những chữ nối như “cho thấy”, “chứng tỏ” để nối về lý lẽ.");
      if (/(ai cũng|không bao giờ|chắc chắn|tất cả mọi)/i.test(an.value)) hint.push("Phân tích có chữ nói quá (“ai cũng”, “không bao giờ”…). Thử nói nhẹ lại xem.");
      document.getElementById("whint").textContent = hint.join(" ");
      var ul = document.getElementById("checks"); ul.innerHTML = "";
      CHECKS.forEach(function (g) {
        var h = document.createElement("li"); h.className = "grp"; h.textContent = g.g; ul.appendChild(h);
        g.items.forEach(function (t) { var li = document.createElement("li"); li.innerHTML = '<label><input type="checkbox"><span>' + t + "</span></label>"; ul.appendChild(li); });
      });
      document.getElementById("ck").hidden = false; document.getElementById("model").hidden = true;
      document.getElementById("ck").scrollIntoView({ behavior: "smooth", block: "start" });
      say(hint.length ? "Bạn viết xong rồi! Mình có vài gợi ý nhỏ màu cam ở trên. Giờ đọc lại bài và đánh dấu từng điều bài của bạn ĐÃ có nhé. Thật thà thôi, đây là để bạn tự giỏi lên mà!" : "Bạn viết xong rồi! Giờ đọc lại bài và đánh dấu từng điều bài của bạn ĐÃ có nhé.", "happy");
    };
    document.getElementById("wedit").onclick = function () { document.getElementById("ck").hidden = true; ev.focus(); };
    document.getElementById("ckdone").onclick = function () {
      var boxes = document.querySelectorAll("#checks input"), n = Array.prototype.filter.call(boxes, function (b) { return b.checked; }).length;
      if (n < boxes.length) {
        document.getElementById("ckhint").textContent = "Còn " + (boxes.length - n) + " điều chưa đánh dấu. Bấm “Sửa bài” để thêm vào, rồi kiểm tra lại nhé!";
        say("Gần xong rồi! Điều nào bài bạn chưa có thì sửa thêm một chút, rồi kiểm tra lại là được sao đó.", "think");
        return;
      }
      document.getElementById("ckhint").textContent = "";
      award(4); bai.done = true; saveBai(bai);
      var m = document.getElementById("model"); m.hidden = false;
      m.innerHTML = '<div class="sub">Bài mẫu để bạn so sánh</div><p>' + layer("l3") + " " + topic.ev + "</p><p>" + layer("l4") + " " + topic.an + '</p><p class="note">' + topic.src + ' Bài mẫu chỉ là một cách viết. Bài của bạn khác đi vẫn tốt, miễn qua được danh sách kiểm tra.</p>';
      m.scrollIntoView({ behavior: "smooth", block: "start" });
      say("Tuyệt vời! +1 Sao Biển cho bài viết đầu tay! Bạn đọc bài mẫu để so, thấy ý hay thì sửa bài mình thêm cũng được nha.", "happy");
      enableNext();
    };
    if (topic) pick(topic);
    if (bai.done && topic) enableNext();
    bindNext(6);
  }

  /* ---------- MÀN 6: Tổng kết ---------- */
  function s6() {
    var n = starCount(), p = MS.saveProgress(COURSE_ID, n), bai = loadBai();
    var topic = TOPICS.filter(function (t) { return t.id === bai.topic; })[0];
    var msg = n === 5 ? "Bạn giỏi quá trời! Giờ bạn đã tự tay làm được lớp thịt và lớp phô mai rồi đó!"
      : n >= 3 ? "Khá lắm! Ôn thêm một chút là bạn làm bằng chứng và phân tích ngon lành luôn!"
      : "Không sao hết, mình học lại phần nào cần nhé. Mình luôn ở đây chờ bạn quay lại!";
    var badge = n === 5 ? "Đầu bếp nghị luận" : n >= 3 ? "Thợ làm bánh chăm chỉ" : "Bạn nhỏ tò mò";
    var mine = topic && bai.ev ? '<div class="mine"><div class="sub">Bài của bạn · ' + MS.esc(topic.topic) + "</div>" + MS.esc(bai.ev.trim()) + "\n" + MS.esc((bai.an || "").trim()) + '</div><div class="actions"><button class="btn ghost" type="button" id="copy">Chép bài để nộp cô</button><span class="note">Bài chỉ lưu trên máy này.</span></div>' : "";
    stage.innerHTML = named(head("Bài 6 · Tổng kết", "Bạn làm được rồi!") +
      talk((state.name ? MS.esc(state.name) + " ơi, xong" : "Xong") + " rồi! " + msg) +
      '<div class="award"><div class="big">' + n + "/5</div>" + MS.starsHTML(n, MAX) + '<span class="badge">Huy hiệu: ' + badge + "</span>" +
      (p && p.runs > 1 ? '<span class="note">Kỷ lục của bạn: ' + p.best + "/5 sao</span>" : "") + "</div>") + mine +
      '<div class="recap"><div class="sub">Hôm nay bạn đã học</div><ul>' +
      "<li>" + layer("l3") + "<span><b>Bằng chứng tốt qua luật 3Đ</b> · Đúng (kiểm chứng được), Đủ cụ thể, Đúng ý.</span></li>" +
      "<li>" + layer("l3") + "<span><b>4 loại bằng chứng</b> · Số liệu từ nghiên cứu, khuyến nghị của tổ chức uy tín, lời người có uy tín, tấm gương người thật. Chuyện riêng của mình chỉ để minh hoạ thêm.</span></li>" +
      "<li>" + layer("l4") + "<span><b>Phân tích</b> · “Điều này cho thấy…” rồi nối về lý lẽ.</span></li>" +
      "<li>" + layer("l4") + "<span><b>Né 3 bẫy</b> · Lặp lại, lạc ý, nói quá.</span></li></ul></div>" +
      '<div class="next"><span class="sub">Khoá 3 · sắp ra mắt</span><p>' + named("Bạn đã làm được lớp thịt và lớp phô mai. Ở Khoá 3, tụi mình sẽ học viết <b>Lý lẽ</b> và <b>Câu chủ đề</b>, rồi ráp cả 5 lớp thành một đoạn văn hoàn chỉnh. Hẹn gặp lại bạn nhé!") + "</p></div>" +
      '<div class="actions"><button class="btn ghost" type="button" id="again">Học lại từ đầu</button><a class="btn ghost" href="nghi-luan-1.html">Ôn Khoá 1</a><span class="grow"></span><a class="btn cta" href="../khong-gian-hoc.html">Về Không gian học</a></div>';
    var cp = document.getElementById("copy");
    if (cp) cp.onclick = function () {
      var txt = topic.topic + "\n" + bai.ev.trim() + " " + (bai.an || "").trim();
      var okk = function () { MS.toast("Đã chép bài. Dán vào tin nhắn hoặc bài nộp cho cô nhé!"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(okk, function () { MS.toast("Máy chưa cho chép tự động. Bạn bôi đen bài ở trên rồi chép nhé."); });
      else MS.toast("Máy chưa cho chép tự động. Bạn bôi đen bài ở trên rồi chép nhé.");
    };
    document.getElementById("again").onclick = function () { state.stars = [false, false, false, false, false]; state.reached = 0; renderStars(); go(0); };
    say(document.getElementById("bubble-text").innerHTML, n >= 3 ? "happy" : "think");
  }

  var SCREENS = [s0, s1, s2, s3, s4, s5, s6];
  renderStars(); go(0);
})();
</script>
